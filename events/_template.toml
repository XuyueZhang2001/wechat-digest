# 事件模板：复制成 events/你的事件.toml，改完直接跑。
#   python run.py run --event events/你的事件.toml

name = "一句话说清这件事"
description = "补充说明：涉及谁、什么时间、核心争点是什么。"

# 别名只影响检索召回，写全称、简称、繁体、英文名、行业黑话。
aliases = ["简称", "English Name"]

# 时间窗：写了 date_from/date_to 就以它们为准，否则用 window_days。
window_days = 120
# date_from = "2026-11-01"
# date_to   = "2026-12-31"

# 检索核心：每个内层数组至少命中一个词，文章才算候选；组与组之间是 AND。
# 第一组锁主体，第二组锁动作或争点。需要排除噪音时再加第三组。
keyword_groups = [
  ["主体词1", "主体词2", "主体英文名"],
  ["动作词1", "动作词2", "同义词", "行业黑话"],
]

# 进阶：同一个话题的不同问法，各写一套，命中任意一套都算（套与套之间是 OR）。
# 适合「离职」和「继任」这种框架不同、但都属于同一件事的情况。
# 用了 keyword_sets 就可以删掉上面的 keyword_groups。
# keyword_sets = [
#   [["主体词"], ["动作词", "同义词"]],
#   [["主体词"], ["继任", "接班", "后续影响"]],
#   [["公司名"], ["失去创始人", "后创始人时代"]],
# ]

notes = """
调参提示：
- 命中太多：加第三组限定词，或提高 --min-score。
- 命中太少：把同义词、繁体、缩写补进对应组，或放宽 window_days。
- 改完先跑 --no-llm，确认命中列表再花钱补全文。
"""
